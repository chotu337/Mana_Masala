<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mana Masala | Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .header {
            background: #8b0000;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .logout-btn {
            border: none;
            background: white;
            color: #8b0000;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .login-box,
        .dashboard {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
        }

        h2 {
            color: #8b0000;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #8b0000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #fff4e5;
            padding: 22px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 30px;
            color: #8b0000;
        }

        .orders {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #8b0000;
            color: white;
        }

        .status {
            padding: 6px 10px;
            border-radius: 5px;
            background: #fff0d6;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }
        }

    </style>

</head>

<body>

    <!-- LOGIN -->

    <div id="loginSection">

        <div class="login-box">

            <h2>🌶️ Mana Masala Admin</h2>

            <p>
                Sign in to manage customer orders.
            </p>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Admin email"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Admin password"
            >

            <button
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

            <p
                class="message"
                id="loginMessage"
            ></p>

        </div>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboardSection" style="display:none;">

        <header class="header">

            <h1>
                🌶️ Mana Masala Dashboard
            </h1>

            <button
                class="logout-btn"
                id="logoutButton"
            >
                Logout
            </button>

        </header>


        <main class="container">

            <div class="dashboard">

                <h2>
                    Customer Orders
                </h2>


                <div class="stats">

                    <div class="stat-card">

                        <p>Total Orders</p>

                        <h3 id="totalOrders">
                            0
                        </h3>

                    </div>


                    <div class="stat-card">

                        <p>Total Quantity</p>

                        <h3 id="totalQuantity">
                            0 kg
                        </h3>

                    </div>


                    <div class="stat-card">

                        <p>Total Sales</p>

                        <h3 id="totalSales">
                            ₹0
                        </h3>

                    </div>

                </div>


                <div class="orders">

                    <table>

                        <thead>

                            <tr>

                                <th>Customer</th>
                                <th>Phone</th>
                                <th>Quantity</th>
                                <th>Address</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>

                            </tr>

                        </thead>

                        <tbody id="ordersTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="admin.js"></script>

</body>

</html>
